<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="sdlc-agent cover art">
<style>
  .serif{font-family:Georgia, 'Times New Roman', serif} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
  .fade{}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.fade,.pulse,.caret{animation:none;opacity:1}}
  
</style>
