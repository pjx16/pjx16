<path d="M200 60h40v30h-40zM200 130h40v30h-40z" fill="#1e1e1c" stroke="#f0eee6" stroke-width="1.5"/>
<path d="M180 110V75H200M180 110V145H200M240 75H260V110M240 145H260V110" fill="none" stroke="#f0eee6" stroke-width="1.5"/>
<rect x="204" y="64" width="32" height="22" fill="#d97757"/>
